<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>10x Parent · Artemis BioLabs live demo</title>
  <style>
    html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; background: #0a0c0e; }
    #loading { font-family: -apple-system, system-ui, sans-serif; padding: 24px; color: #8b98a0; }
  </style>
</head>
<body>
  <div id="root"><div id="loading">Loading spatial portal&hellip; (serve this folder over HTTP)</div></div>
  <script type="module">
    let importWithMap;
    try {
      importWithMap = (await import('https://unpkg.com/dynamic-importmap@0.1.0')).importWithMap;
    } catch (e) {
      importWithMap = (await import('https://cdn.vitessce.io/dynamic-importmap@0.1.0/dist/index.js')).importWithMap;
    }

    const importMap = {
      imports: {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "vitessce": "https://cdn.vitessce.io/vitessce@3.9.11/dist/index.min.js"
      }
    };

    const React = await importWithMap("react", importMap);
    const { createRoot } = await importWithMap("react-dom/client", importMap);
    const { Vitessce } = await importWithMap("vitessce", importMap);

    const config = {"version": "1.0.16", "name": "10x Parent \u00b7 Artemis BioLabs live demo", "description": "BANKSY domains + putative cell states on a public GBM Visium section", "datasets": [{"uid": "A", "name": "10x Parent", "files": [{"fileType": "anndata.zarr", "url": "./data.zarr", "options": {"obsLocations": {"path": "obsm/spatial"}, "obsEmbedding": [{"path": "obsm/spatial", "dims": [0, 1], "embeddingType": "Spatial"}, {"path": "obsm/X_umap", "dims": [0, 1], "embeddingType": "UMAP"}], "obsSets": [{"name": "Putative cell state", "path": "obs/putative_cell_type"}, {"name": "BANKSY domain", "path": "obs/banksy_cluster"}], "obsFeatureMatrix": {"path": "X", "initialFeatureFilterPath": "var/top_marker"}}, "coordinationValues": {"obsType": "cell"}}]}], "coordinationSpace": {"dataset": {"A": "A"}, "embeddingType": {"SPATIAL": "Spatial", "UMAP": "UMAP"}, "obsSetSelection": {"A": [["Putative cell state", "Ac-Like Tumor Cells"], ["Putative cell state", "Astrocytes"], ["Putative cell state", "Endothelial Cells"], ["Putative cell state", "Mes-Like Tumor Cells"], ["Putative cell state", "Microglia/Tams"], ["Putative cell state", "Neurons"], ["Putative cell state", "Npc-Like Tumor Cells"], ["Putative cell state", "Oligodendrocytes"], ["Putative cell state", "Pericytes/Smooth Muscle"], ["Putative cell state", "Proliferating Tumor Cells"]]}, "obsSetExpansion": {"A": [["Putative cell state"], ["BANKSY domain"]]}, "obsColorEncoding": {"A": "cellSetSelection"}, "embeddingObsRadiusMode": {"SPATIAL": "manual", "UMAP": "manual"}, "embeddingObsRadius": {"SPATIAL": 2.4, "UMAP": 1.9}, "embeddingObsOpacityMode": {"SPATIAL": "manual", "UMAP": "manual"}, "embeddingObsOpacity": {"SPATIAL": 1.0, "UMAP": 0.85}}, "layout": [{"component": "scatterplot", "props": {"title": "Spatial \u00b7 10x Parent"}, "coordinationScopes": {"dataset": "A", "obsSetSelection": "A", "obsColorEncoding": "A", "obsSetExpansion": "A", "embeddingType": "SPATIAL", "embeddingObsRadiusMode": "SPATIAL", "embeddingObsRadius": "SPATIAL", "embeddingObsOpacityMode": "SPATIAL", "embeddingObsOpacity": "SPATIAL"}, "x": 0, "y": 0, "w": 5, "h": 7}, {"component": "scatterplot", "props": {"title": "UMAP (BANKSY space)"}, "coordinationScopes": {"dataset": "A", "obsSetSelection": "A", "obsColorEncoding": "A", "obsSetExpansion": "A", "embeddingType": "UMAP", "embeddingObsRadiusMode": "UMAP", "embeddingObsRadius": "UMAP", "embeddingObsOpacityMode": "UMAP", "embeddingObsOpacity": "UMAP"}, "x": 5, "y": 0, "w": 4, "h": 7}, {"component": "obsSets", "coordinationScopes": {"dataset": "A", "obsSetSelection": "A", "obsColorEncoding": "A", "obsSetExpansion": "A"}, "x": 9, "y": 0, "w": 3, "h": 7}, {"component": "featureList", "coordinationScopes": {"dataset": "A", "obsSetSelection": "A", "obsColorEncoding": "A"}, "x": 0, "y": 7, "w": 3, "h": 5}, {"component": "heatmap", "coordinationScopes": {"dataset": "A", "obsSetSelection": "A", "obsColorEncoding": "A"}, "x": 3, "y": 7, "w": 9, "h": 5}], "initStrategy": "auto", "vitessceMetadata": {"lab_name": "Artemis BioLabs", "portal_title": "10x Parent live demo", "has_spatial_coordinates": true, "spatial_coordinate_origin": "measured", "has_measured_spatial_coordinates": true}};

    // Vitessce's zarr loader calls `new URL(url)`, which rejects relative
    // strings. Resolve each data file URL against this page's location so the
    // portal works from whatever host/port serves the folder.
    for (const ds of (config.datasets || [])) {
      for (const f of (ds.files || [])) {
        if (f.url && !/^https?:\/\//.test(f.url)) {
          f.url = new URL(f.url, window.location.href).href;
        }
      }
    }

    const e = React.createElement;
    createRoot(document.getElementById('root')).render(
      e(Vitessce, { config, theme: 'dark', height: window.innerHeight })
    );
  </script>
</body>
</html>
