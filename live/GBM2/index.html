<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GBM2 · Artemis BioLabs live demo</title>
  <style>
    html, body, #root { margin: 0; padding: 0; width: 100%; height: 100%; background: #0b0b0d; }
    #loading { font-family: -apple-system, system-ui, sans-serif; padding: 24px; color: #8b8b95; }
  </style>
</head>
<body>
  <div id="root"><div id="loading">Loading spatial portal&hellip; (serve this folder over HTTP)</div></div>
  <script type="module">
    let importWithMap;
    try {
      importWithMap = (await import('https://unpkg.com/dynamic-importmap@0.1.0')).importWithMap;
    } catch (e) {
      importWithMap = (await import('https://cdn.vitessce.io/dynamic-importmap@0.1.0/dist/index.js')).importWithMap;
    }

    const importMap = {
      imports: {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom": "https://esm.sh/react-dom@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "vitessce": "https://cdn.vitessce.io/vitessce@3.9.11/dist/index.min.js"
      }
    };

    const React = await importWithMap("react", importMap);
    const { createRoot } = await importWithMap("react-dom/client", importMap);
    const { Vitessce } = await importWithMap("vitessce", importMap);

    const config = {"version": "1.0.16", "name": "GBM2 \u00b7 Artemis BioLabs live demo", "description": "BANKSY domains + putative cell states on a public GBM Visium section", "datasets": [{"uid": "A", "name": "GBM2", "files": [{"fileType": "anndata.zarr", "url": "./data.zarr", "options": {"obsLocations": {"path": "obsm/spatial"}, "obsEmbedding": [{"path": "obsm/spatial", "dims": [0, 1], "embeddingType": "Spatial"}], "obsSets": [{"name": "Putative cell state", "path": "obs/putative_cell_type"}, {"name": "BANKSY domain", "path": "obs/banksy_cluster"}], "obsFeatureMatrix": {"path": "X", "initialFeatureFilterPath": "var/top_marker"}}, "coordinationValues": {"obsType": "cell"}}]}], "coordinationSpace": {"dataset": {"A": "A"}, "embeddingType": {"A": "Spatial"}, "obsSetSelection": {"A": null}, "obsColorEncoding": {"A": "cellSetSelection"}}, "layout": [{"component": "scatterplot", "coordinationScopes": {"dataset": "A", "embeddingType": "A", "obsSetSelection": "A", "obsColorEncoding": "A"}, "x": 0, "y": 0, "w": 12, "h": 6}, {"component": "obsSets", "coordinationScopes": {"dataset": "A", "obsSetSelection": "A", "obsColorEncoding": "A"}, "x": 0, "y": 6, "w": 3, "h": 6}, {"component": "featureList", "coordinationScopes": {"dataset": "A", "obsSetSelection": "A", "obsColorEncoding": "A"}, "x": 3, "y": 6, "w": 3, "h": 6}, {"component": "heatmap", "coordinationScopes": {"dataset": "A", "obsSetSelection": "A", "obsColorEncoding": "A"}, "x": 6, "y": 6, "w": 6, "h": 6}], "initStrategy": "auto", "vitessceMetadata": {"lab_name": "Artemis BioLabs", "portal_title": "GBM2 live demo", "has_spatial_coordinates": true, "spatial_coordinate_origin": "measured", "has_measured_spatial_coordinates": true}};

    // Vitessce's zarr loader calls `new URL(url)`, which rejects relative
    // strings. Resolve each data file URL against this page's location so the
    // portal works from whatever host/port serves the folder.
    for (const ds of (config.datasets || [])) {
      for (const f of (ds.files || [])) {
        if (f.url && !/^https?:\/\//.test(f.url)) {
          f.url = new URL(f.url, window.location.href).href;
        }
      }
    }

    const e = React.createElement;
    createRoot(document.getElementById('root')).render(
      e(Vitessce, { config, theme: 'dark', height: window.innerHeight })
    );
  </script>
</body>
</html>
