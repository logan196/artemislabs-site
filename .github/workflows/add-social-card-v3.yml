name: Add final social preview card

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-social-card-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add verified final card
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/logan196/artemislabs-site/gh-pages/artemis-social-card-v3.png' -o public/artemis-social-card-v3.png
          echo 'd58ef54e9e44a63d983127ed308b25362e654501c6d193675b4b8726169b3446  public/artemis-social-card-v3.png' | sha256sum --check -
          rm -f .github/workflows/add-social-card-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/artemis-social-card-v3.png .github/workflows/add-social-card-v3.yml
          git commit -m "Add final social preview card"
          git push
