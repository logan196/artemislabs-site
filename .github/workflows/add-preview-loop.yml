name: Add animated social preview

on:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/add-preview-loop.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify preview loop
        run: |
          set -euo pipefail
          cat preview-loop-part-00.txt preview-loop-part-01.txt preview-loop-part-02.txt preview-loop-part-03.txt preview-loop-part-04.txt preview-loop-part-05.txt | base64 -d > artemis-preview-loop-v1.mp4
          echo '30a3e54a7a7db1e2cd3aa30cd5c01a702cb086e01ae0fa7731731269ec647a19  artemis-preview-loop-v1.mp4' | sha256sum --check -
          rm -f preview-loop-part-00.txt preview-loop-part-01.txt preview-loop-part-02.txt preview-loop-part-03.txt preview-loop-part-04.txt preview-loop-part-05.txt .github/workflows/add-preview-loop.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A artemis-preview-loop-v1.mp4 preview-loop-part-00.txt preview-loop-part-01.txt preview-loop-part-02.txt preview-loop-part-03.txt preview-loop-part-04.txt preview-loop-part-05.txt .github/workflows/add-preview-loop.yml
          git commit -m "Add animated Artemis social preview"
          git push
