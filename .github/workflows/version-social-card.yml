name: Version social preview card

on:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/version-social-card.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy and verify versioned card
        run: |
          set -euo pipefail
          cp artemis-social-card.png artemis-social-card-v2.png
          echo '43487e4e0fffb3fd304f002fcc14ec09cb9e2c04114147cf49dc222cc10e220f  artemis-social-card-v2.png' | sha256sum --check -
          rm -f .github/workflows/version-social-card.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artemis-social-card-v2.png .github/workflows/version-social-card.yml
          git commit -m "Version refreshed social preview card"
          git push
