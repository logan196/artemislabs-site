name: Generate social preview card

on:
  push:
    branches: [gh-pages]
    paths:
      - social-card-base64.txt
      - .github/workflows/generate-social-card.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify card
        run: |
          set -euo pipefail
          base64 -d social-card-base64.txt > artemis-social-card.png
          echo '43487e4e0fffb3fd304f002fcc14ec09cb9e2c04114147cf49dc222cc10e220f  artemis-social-card.png' | sha256sum --check -
      - name: Commit card and clean temporary files
        run: |
          set -euo pipefail
          rm -f social-card-base64.txt .github/workflows/generate-social-card.yml .github/workflows/.github/workflows/generate-social-card.yml
          rmdir .github/workflows/.github/workflows .github/workflows/.github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artemis-social-card.png social-card-base64.txt .github/workflows
          git commit -m "Refresh Artemis social preview card"
          git push
