name: Generate social preview card

on:
  push:
    branches: [gh-pages]

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode card
        run: base64 -d social-card-base64.txt > artemis-social-card.png
      - name: Commit card
        run: |
          rm social-card-base64.txt .github/workflows/generate-social-card.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artemis-social-card.png social-card-base64.txt .github/workflows/generate-social-card.yml
          git commit -m "Add Artemis social preview card"
          git push
