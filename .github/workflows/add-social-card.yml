name: Add social preview card

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-social-card.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add verified card
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/logan196/artemislabs-site/gh-pages/artemis-social-card-v2.png' -o public/artemis-social-card-v2.png
          echo '43487e4e0fffb3fd304f002fcc14ec09cb9e2c04114147cf49dc222cc10e220f  public/artemis-social-card-v2.png' | sha256sum --check -
          rm -f .github/workflows/add-social-card.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/artemis-social-card-v2.png .github/workflows/add-social-card.yml
          git commit -m "Add versioned social preview card"
          git push
