name: Add animated social preview asset

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-preview-loop-main.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify preview loop
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/logan196/artemislabs-site/gh-pages/artemis-preview-loop-v1.mp4 -o public/artemis-preview-loop-v1.mp4
          echo '30a3e54a7a7db1e2cd3aa30cd5c01a702cb086e01ae0fa7731731269ec647a19  public/artemis-preview-loop-v1.mp4' | sha256sum --check -
          rm -f .github/workflows/add-preview-loop-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/artemis-preview-loop-v1.mp4 .github/workflows/add-preview-loop-main.yml
          git commit -m "Add animated Artemis social preview asset"
          git push
