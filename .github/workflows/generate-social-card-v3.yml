name: Generate final social preview card

on:
  push:
    branches: [gh-pages]
    paths:
      - .github/workflows/generate-social-card-v3.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify final card
        run: |
          set -euo pipefail
          base64 -d social-card-base64.txt > artemis-social-card-v3.png
          echo 'd58ef54e9e44a63d983127ed308b25362e654501c6d193675b4b8726169b3446  artemis-social-card-v3.png' | sha256sum --check -
          rm -f social-card-base64.txt .github/workflows/generate-social-card-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artemis-social-card-v3.png social-card-base64.txt .github/workflows/generate-social-card-v3.yml
          git commit -m "Add final Artemis social preview card"
          git push
